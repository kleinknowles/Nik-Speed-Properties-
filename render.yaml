databases:
  - name: nikspeed-test-db
    databaseName: nikspeed
    user: nikspeed
    region: singapore
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: nikspeed-test-api
    runtime: docker
    region: singapore
    plan: free
    dockerContext: ./backend/NikSpeed.Api
    dockerfilePath: ./backend/NikSpeed.Api/Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSQL
      - key: Storage__Provider
        value: Local
      - key: ConnectionStrings__Marketplace
        fromDatabase:
          name: nikspeed-test-db
          property: connectionString
      - key: Jwt__Issuer
        value: NikSpeed.Api
      - key: Jwt__Audience
        value: NikSpeed.Web
      - key: Jwt__Key
        generateValue: true
      - key: WebOrigin
        fromService:
          type: web
          name: nikspeed-test-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: Pesapal__BaseUrl
        value: https://cybqa.pesapal.com/pesapalv3
      - key: Pesapal__ConsumerKey
        value: ""
      - key: Pesapal__ConsumerSecret
        value: ""
      - key: Pesapal__NotificationId
        value: ""
      - key: Pesapal__CallbackUrl
        value: ""

  - type: web
    name: nikspeed-test-web
    runtime: docker
    region: singapore
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nikspeed-test-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
