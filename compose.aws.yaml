services:
  api:
    build:
      context: ./backend/NikSpeed.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSQL
      ConnectionStrings__Marketplace: Host=${DATABASE_HOST:?Set DATABASE_HOST};Port=${DATABASE_PORT:-5432};Database=${DATABASE_NAME:-nikspeed};Username=${DATABASE_USER:?Set DATABASE_USER};Password=${DATABASE_PASSWORD:?Set DATABASE_PASSWORD};SSL Mode=Require;Trust Server Certificate=true
      Jwt__Issuer: NikSpeed.Api
      Jwt__Audience: NikSpeed.Web
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
      WebOrigin: ${WEB_ORIGIN:?Set WEB_ORIGIN to the site's HTTPS URL}
      Storage__Provider: S3
      Storage__S3__Endpoint: https://s3.${AWS_REGION:?Set AWS_REGION}.amazonaws.com
      Storage__S3__Bucket: ${S3_BUCKET:?Set S3_BUCKET}
      Storage__S3__Region: ${AWS_REGION}
      Storage__S3__AccessKeyId: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      Storage__S3__SecretAccessKey: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      Pesapal__BaseUrl: ${PESAPAL_BASE_URL:-https://cybqa.pesapal.com/pesapalv3}
      Pesapal__ConsumerKey: ${PESAPAL_CONSUMER_KEY:-}
      Pesapal__ConsumerSecret: ${PESAPAL_CONSUMER_SECRET:-}
      Pesapal__NotificationId: ${PESAPAL_NOTIFICATION_ID:-}
      Pesapal__CallbackUrl: ${WEB_ORIGIN}/payment/complete
    expose:
      - "8080"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://api:8080
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the site's DNS name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.aws:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
